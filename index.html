<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Knowvia - Campus Social & Academic Platform</title>
    <meta name="description" content="Knowvia is the premier campus social, academic, and event network for engineering students, faculty, and departments." />
    <meta name="keywords" content="Knowvia, campus social, engineering college, RVR & JC, academic feed, student portal, tech fests, hackathons" />
    <meta name="author" content="Knowvia Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://knowvia.edu/" />

    <!-- Performance: Preconnect & DNS-Prefetch for External Media CDN & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://knowvia.edu/" />
    <meta property="og:title" content="Knowvia - Campus Social & Academic Platform" />
    <meta property="og:description" content="Connect with department updates, tech reels, college announcements, and campus events in real-time." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://knowvia.edu/" />
    <meta name="twitter:title" content="Knowvia - Campus Social & Academic Platform" />
    <meta name="twitter:description" content="Connect with department updates, tech reels, college announcements, and campus events in real-time." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Mobile & PWA Configuration -->
    <meta name="theme-color" content="#F2F3F5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Structured Data: Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Knowvia",
      "url": "https://knowvia.edu/",
      "description": "Campus social network and academic portal for engineering students and faculty.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://knowvia.edu/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
